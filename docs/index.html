<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МАЙСТЕР — ойын ашылуда</title>
  <meta name="description" content="МАЙСТЕР — майлар мен тағамтану туралы қазақша онлайн білім сайысы.">
  <meta http-equiv="refresh" content="2;url=https://rankings-outlets-robot-bristol.trycloudflare.com">
  <style>
    :root { color-scheme: dark; --cream:#f3ead8; --gold:#e8b44a; --olive:#8aae55; --muted:#a9a392; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(232,180,74,.13), transparent 34%),
        radial-gradient(circle at 70% 80%, rgba(138,174,85,.08), transparent 35%),
        #0c100b;
      color: var(--cream); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: ""; position: fixed; inset: -20%; pointer-events: none;
      background: conic-gradient(from 180deg at 50% 50%, transparent, rgba(232,180,74,.04), transparent 30%);
      animation: turn 18s linear infinite;
    }
    @keyframes turn { to { transform: rotate(360deg); } }
    main { position: relative; z-index: 1; width: min(420px, calc(100vw - 40px)); text-align: center; }
    .logo {
      display: grid; place-items: center; width: 86px; height: 86px; margin: 0 auto 24px;
      border-radius: 50%; border: 1px solid rgba(232,180,74,.45);
      background: rgba(20,27,18,.8); box-shadow: 0 0 0 10px rgba(232,180,74,.04), 0 22px 60px rgba(0,0,0,.45);
      animation: rise .7s cubic-bezier(.22,.8,.3,1) both;
    }
    .logo img { width: 62px; height: 62px; }
    .eyebrow {
      color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
      animation: rise .6s .08s cubic-bezier(.22,.8,.3,1) both;
    }
    h1 {
      margin: 12px 0 8px; font-family: Georgia, "Times New Roman", serif; font-weight: 500;
      font-size: clamp(42px, 12vw, 62px); letter-spacing: -.045em; line-height: 1;
      animation: rise .7s .14s cubic-bezier(.22,.8,.3,1) both;
    }
    p {
      max-width: 300px; margin: 0 auto; color: var(--muted); font-size: 13px; line-height: 1.6;
      animation: rise .6s .2s cubic-bezier(.22,.8,.3,1) both;
    }
    .bar {
      width: 170px; height: 2px; margin: 26px auto 22px; border-radius: 2px;
      background: rgba(243,234,216,.1); overflow: hidden;
    }
    .bar i {
      display: block; width: 100%; height: 100%;
      background: linear-gradient(90deg, var(--olive), var(--gold), transparent);
      transform-origin: 0 50%; animation: load 2s linear both;
    }
    .go {
      display: inline-flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 24px;
      border-radius: 999px; background: linear-gradient(135deg, #f2d58c, var(--gold));
      color: #171a0f; font-size: 13px; font-weight: 700; text-decoration: none;
      box-shadow: 0 12px 30px rgba(232,180,74,.16);
      animation: rise .6s .3s cubic-bezier(.22,.8,.3,1) both;
    }
    .go span { font-size: 18px; line-height: 1; }
    .note { margin-top: 20px; color: #7f7b6c; font-size: 10px; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="logo.svg" alt="МАЙСТЕР"></div>
    <div class="eyebrow">Май · білім · сайыс</div>
    <h1>МАЙСТЕР</h1>
    <p>Майлар мен тағамтану туралы қазақша білім сайысы. Арена ашылуда…</p>
    <div class="bar"><i></i></div>
    <a class="go" href="https://rankings-outlets-robot-bristol.trycloudflare.com">Ойынды ашу <span>→</span></a>
    <p class="note">Егер бет ашылмаса, сервер уақытша өшіп қалған болуы мүмкін.</p>
  </main>
  <script>
    setTimeout(function () {
      window.location.replace('https://rankings-outlets-robot-bristol.trycloudflare.com');
    }, 2000);
  </script>
</body>
</html>
